<!doctype html><html lang="lt"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>FIBA Champions League 2026–2027</title>
<style>
*{box-sizing:border-box}
body{font-family:Roboto,system-ui,sans-serif;margin:0;color:#1a1a1a;background:#fff}
header{display:flex;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid #e3e3e3}
.logo{font-size:30px;line-height:1}
h1{font-size:19px;font-weight:500;margin:0}
.sub{font-size:12.5px;color:#777;margin-top:2px}
h2{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:500;margin:22px 10px 8px}
h2 img{height:16px;max-width:36px;object-fit:contain}
.t{border:1px solid #e0e0e0;border-radius:6px;margin:6px 10px;padding:10px 12px;background:#fff}
.r{display:flex;align-items:center;gap:10px}
.r img{width:28px;height:28px;object-fit:contain;flex:none}
.n{flex:1;font-size:16px}
.p{width:34px;text-align:right;font-size:16px}
.rec{width:44px;text-align:center;color:#777;font-size:15px}
.f{display:flex;gap:3px;min-width:58px;justify-content:flex-end}
.f b{width:18px;height:18px;border-radius:3px;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.W{background:#1e9e3e}.L{background:#d93025}
.s{margin-top:6px;font-size:12.5px;color:#777}
.na{float:right;color:#b8860b;font-size:12.5px}
a{color:inherit;text-decoration:none}
</style></head><body>
<header><div class="logo">🏀</div><div><h1 id="c">FIBA Champions League</h1><div class="sub" id="u">Kraunama…</div></div></header>
<main id="m"></main>
<script>
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
fetch("data.json?"+Date.now()).then(r=>r.json()).then(d=>{
 c.textContent=d.competition+": komandos savo lygose";
 u.textContent="Atnaujinta "+d.updated+", duomenys: Flashscore";
 m.innerHTML=d.leagues.map(l=>`<h2>${l.logo?`<img src="${esc(l.logo)}" alt="">`:''}${esc(l.league)}</h2>`+
  l.teams.map(t=>`<div class="t"><a href="${esc(t.url||'#')}" class="r">
   ${t.logo?`<img src="${esc(t.logo)}" alt="">`:'<span style="width:28px"></span>'}
   <span class="n">${esc(t.name)}</span>
   <span class="p">${t.pos??'–'}</span><span class="rec">${esc(t.rec??'')}</span>
   <span class="f">${(t.form||[]).map(x=>`<b class="${x}">${x==='W'?'W':'L'}</b>`).join('')}</span></a>
   <div class="s">${t.next?'Kitos rungtynės: '+esc(t.next):''}${t.rec?'':'<span class="na">Lygos sezonas dar nepradėtas</span>'}
   <span style="color:#aaa"> · ${esc(t.g)} gr.</span></div></div>`).join('')).join('');
}).catch(()=>u.textContent="Nepavyko įkelti data.json (paleisk Actions)");
</script></body></html>
