<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07111f">
<title>BCL ir EuroCup komandos savo lygose</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#07111f;--card:#0e1c30;--line:#1d3050;--tx:#e8eef7;--mu:#8ea2bd;--bcl:#3aa0ff;--eu:#ffb020;--w:#33d49a;--l:#ff5d6c}
*{box-sizing:border-box}
body{margin:0 auto;max-width:1300px;padding:12px;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,sans-serif}
h1{font-size:1.3rem;margin:.4rem 0}
nav{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
nav button,.sw button{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:10px 16px;font:inherit;cursor:pointer;display:flex;align-items:center;gap:8px}
nav button.on{border-color:var(--c,var(--bcl));box-shadow:inset 0 -3px 0 var(--c,var(--bcl))}
nav img{height:22px}
details{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:8px}
summary{cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips label{background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:4px 10px;cursor:pointer;font-size:.85rem}
.chips label:has(input:checked){border-color:var(--w)}
.chips input{margin-right:5px}
.tools{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.tools button{background:none;color:var(--mu);border:1px solid var(--line);border-radius:8px;padding:4px 10px;cursor:pointer}
#grid{display:grid;gap:12px;grid-template-columns:1fr}
#grid.two{grid-template-columns:1fr 1fr}
@media(max-width:800px){#grid.two{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.card h2{margin:0 0 4px;font-size:1.05rem;display:flex;gap:8px;align-items:center}
.card h2 img{height:24px}
.kpi{color:var(--mu);font-size:.9rem;margin-bottom:8px}
.dn{max-width:280px;margin:auto;position:relative}
.sw{display:flex;gap:6px;margin:10px 0}
.sw button.on{border-color:var(--w)}
table{width:100%;border-collapse:collapse;font-size:.9rem}
td,th{padding:6px;border-bottom:1px solid var(--line);text-align:right}
td:first-child,th:first-child{text-align:left}
.msg{color:var(--l);padding:12px}
</style>
</head>
<body>
<h1>Komandos savo nacionaliniuose čempionatuose</h1>
<nav id="tabs"></nav>
<details id="fl"><summary>Lygos</summary><div class="chips" id="lg"></div>
<div class="tools"><button data-a="l1">Visos</button><button data-a="l0">Nė vienos</button></div></details>
<details id="ft"><summary>Komandos</summary><div class="chips" id="tm"></div>
<div class="tools"><button data-a="t1">Visos</button><button data-a="t0">Nė vienos</button></div></details>
<div class="sw" id="mode"></div>
<div id="msg"></div>
<main id="grid"></main>

<script>
/* ===== KONFIGŪRACIJA ===== */
const COMP = {
  bcl: {name:'FIBA Champions League', short:'BCL', color:'#3aa0ff',
        url:'https://andriuspanama.github.io/Bcl-teams/data.json',
        logo:'https://andriuspanama.github.io/Bcl-teams/logos/736a7e173080.png'},
  eu:  {name:'EuroCup', short:'EuroCup', color:'#ffb020',
        url:'https://andriuspanama.github.io/Eurocup-teams/data.json',
        logo:'https://andriuspanama.github.io/Eurocup-teams/logos/1eded2c92fe0.png'}
};

/* ===== ADAPTERIS: jei tavo data.json laukai kitokie, taisyk TIK čia ===== */
 function adapt(raw){
  return raw.teams.map(t => {
    const [w, l] = String(t.record || '0-0').split('-').map(Number);
    const gs = (t.last5 || []).map(g => {
      const [a, b] = String(g.score).split(':').map(Number);
      if (isNaN(a) || isNaN(b)) return null;
      // Flashscore rezultatas rašomas "šeimininkai:svečiai"
      const home = g.venue === 'H' ? true : g.venue === 'A' ? false : (g.wl === 'W' ? a > b : a < b);
      return home ? {pf:a, pa:b} : {pf:b, pa:a};
    }).filter(Boolean);
    return {
      name: t.name, league: t.league, w: w || 0, l: l || 0, n: gs.length,
      pf: gs.reduce((s,g) => s + g.pf, 0),
      pa: gs.reduce((s,g) => s + g.pa, 0)
    };
  });
}

/* ===== BŪSENA ===== */
const S = JSON.parse(localStorage.getItem('st') || '{}');
S.offL = new Set(S.offL || []); S.offT = new Set(S.offT || []);
S.avg = !!S.avg;
S.view = location.hash.slice(1) || S.view || 'bcl';
const D = {}, charts = {};
const $ = id => document.getElementById(id);
const save = () => localStorage.setItem('st', JSON.stringify({offL:[...S.offL], offT:[...S.offT], avg:S.avg, view:S.view}));
const comps = () => S.view === 'cmp' ? ['bcl','eu'] : [S.view];
const vis = c => D[c].filter(t => !S.offL.has(t.league) && !S.offT.has(c + '|' + t.name));
function sum(a){
  const w = a.reduce((x,t)=>x+t.w,0), l = a.reduce((x,t)=>x+t.l,0), n = a.reduce((x,t)=>x+t.n,0);
  const pf = a.reduce((x,t)=>x+t.pf,0), pa = a.reduce((x,t)=>x+t.pa,0);
  return {w,l,n,pf,pa,pct: w+l ? 100*w/(w+l) : 0, apf: n ? pf/n : 0, apa: n ? pa/n : 0};
}

/* ===== UI ===== */
function drawTabs(){
  $('tabs').innerHTML =
    ['bcl','eu'].map(c => `<button data-v="${c}" style="--c:${COMP[c].color}" class="${S.view===c?'on':''}"><img src="${COMP[c].logo}" alt="">${COMP[c].short}</button>`).join('') +
    `<button data-v="cmp" style="--c:#33d49a" class="${S.view==='cmp'?'on':''}">⇄ Palyginimas</button>`;
  $('mode').innerHTML = `<button data-m="0" class="${S.avg?'':'on'}">Iš viso</button><button data-m="1" class="${S.avg?'on':''}">Vidurkis per rungtynes</button>`;
}
function drawFilters(){
  const cs = comps();
  const leagues = [...new Set(cs.flatMap(c => D[c].map(t => t.league)))].sort();
  $('lg').innerHTML = leagues.map(l => `<label><input type="checkbox" data-l="${l}" ${S.offL.has(l)?'':'checked'}>${l}</label>`).join('');
  $('tm').innerHTML = cs.flatMap(c => D[c].filter(t => !S.offL.has(t.league)).map(t => {
    const k = c + '|' + t.name;
    return `<label><input type="checkbox" data-t="${k}" ${S.offT.has(k)?'':'checked'}>${cs.length>1?COMP[c].short+' · ':''}${t.name}</label>`;
  })).join('');
}
function mk(id, cfg){ charts[id]?.destroy(); charts[id] = new Chart($(id), cfg); }

function render(){
  Object.values(charts).forEach(c => c.destroy());
  const cs = comps(), g = $('grid');
  g.className = cs.length > 1 ? 'two' : '';
  const sums = cs.map(c => sum(vis(c)));
  const max = Math.max(1, ...cs.flatMap(c => vis(c).flatMap(t => S.avg ? [t.pf/(t.n||1), t.pa/(t.n||1)] : [t.pf, t.pa])));
  g.innerHTML = cs.map((c,i) => {
    const s = sums[i], n = vis(c).length;
    return `<section class="card"><h2><img src="${COMP[c].logo}" alt="">${COMP[c].name}</h2>
      <div class="kpi">${n} komandų · ${s.w}–${s.l} (${s.pct.toFixed(0)}% pergalių) · pelnyta ${s.pf}, praleista ${s.pa}</div>
      <div class="dn"><canvas id="d-${c}"></canvas></div>
      <div style="position:relative;height:${Math.max(220, n*30+60)}px;margin-top:14px"><canvas id="b-${c}"></canvas></div></section>`;
  }).join('') + (cs.length > 1 ? `<section class="card" style="grid-column:1/-1"><h2>Palyginimas</h2><table>
    <tr><th></th><th>Komandos</th><th>Pergalių %</th><th>Pelnyta / rung.</th><th>Praleista / rung.</th><th>Skirtumas</th></tr>
    ${cs.map((c,i)=>`<tr><td>${COMP[c].short}</td><td>${vis(c).length}</td><td>${sums[i].pct.toFixed(1)}</td><td>${sums[i].apf.toFixed(1)}</td><td>${sums[i].apa.toFixed(1)}</td><td>${(sums[i].apf-sums[i].apa).toFixed(1)}</td></tr>`).join('')}
    </table></section>` : '');
  cs.forEach((c,i) => {
    mk('d-'+c, {type:'doughnut',
      data:{labels:['Pergalės','Pralaimėjimai'], datasets:[{data:[sums[i].w, sums[i].l], backgroundColor:['#33d49a','#ff5d6c'], borderWidth:0}]},
      options:{cutout:'65%', plugins:{legend:{labels:{color:'#e8eef7'}}}}});
    const ts = vis(c).slice().sort((a,b) => (b.pf-b.pa)/(b.n||1) - (a.pf-a.pa)/(a.n||1));
    const f = t => S.avg ? v => +(v/(t.n||1)).toFixed(1) : v => v;
    mk('b-'+c, {type:'bar',
      data:{labels:ts.map(t=>t.name), datasets:[
        {label:'Pelnyta', data:ts.map(t=>f(t)(t.pf)), backgroundColor:'#33d49a'},
        {label:'Praleista', data:ts.map(t=>f(t)(t.pa)), backgroundColor:'#ff5d6c'}]},
      options:{indexAxis:'y', maintainAspectRatio:false,
        scales:{x:{max: cs.length > 1 ? Math.ceil(max*1.05) : undefined, ticks:{color:'#8ea2bd'}, grid:{color:'#1d3050'}}, y:{ticks:{color:'#e8eef7'}, grid:{display:false}}},
        plugins:{legend:{labels:{color:'#e8eef7'}}}}});
  });
}
function refresh(){ drawTabs(); drawFilters(); render(); save(); }

/* ===== ĮVYKIAI ===== */
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.v) { S.view = b.dataset.v; location.hash = S.view; refresh(); }
  if (b.dataset.m) { S.avg = b.dataset.m === '1'; refresh(); }
  const a = b.dataset.a; if (!a) return;
  if (a[0] === 'l') { S.offL = new Set(a === 'l0' ? [...document.querySelectorAll('[data-l]')].map(i => i.dataset.l) : []); }
  if (a[0] === 't') { S.offT = new Set(a === 't0' ? [...document.querySelectorAll('[data-t]')].map(i => i.dataset.t) : []); }
  refresh();
});
document.addEventListener('change', e => {
  const i = e.target;
  if (i.dataset.l) i.checked ? S.offL.delete(i.dataset.l) : S.offL.add(i.dataset.l);
  if (i.dataset.t) i.checked ? S.offT.delete(i.dataset.t) : S.offT.add(i.dataset.t);
  if (i.dataset.l) { drawFilters(); render(); save(); } else { render(); save(); }
});

/* ===== DUOMENŲ ĮKĖLIMAS ===== */
Promise.all(Object.entries(COMP).map(([c, o]) =>
  fetch(o.url + '?t=' + Date.now()).then(r => { if (!r.ok) throw new Error(o.short + ': HTTP ' + r.status); return r.json(); })
    .then(j => { D[c] = adapt(j); })
)).then(refresh).catch(err => {
  $('msg').innerHTML = `<div class="msg">Nepavyko įkelti duomenų: ${err.message}. Patikrink, ar data.json egzistuoja abiejuose repo.</div>`;
});
</script>
</body>
</html>
